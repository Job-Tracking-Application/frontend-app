server {
    listen 80;
    server_name jobsync.vivekbhosale.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jobsync.vivekbhosale.in;

    ssl_certificate     /etc/letsencrypt/live/jobsync.vivekbhosale.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobsync.vivekbhosale.in/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------
    # Security Headers
    # -----------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -----------------------------
    # Reverse Proxy → Spring Boot
    # -----------------------------
    location /api/ {
        proxy_pass http://jobtracking-backend:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;
    }


    # -----------------------------
    # Frontend (React SPA)
    # -----------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------
    # Static Assets Cache
    # -----------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -----------------------------
    # Health Check
    # -----------------------------
    location /health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    server_tokens off;
}